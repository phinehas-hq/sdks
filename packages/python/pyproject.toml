[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phinehas"
version = "1.0.0"
description = "Phinehas: Active defense in-process security middleware with socket severance and RFC 8615 wildcard trapping"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Phinehas HQ", email = "security@phinehas.dev" }
]
keywords = [
    "security",
    "middleware",
    "waf",
    "fastapi",
    "starlette",
    "active-defense",
    "rfc8615"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware"
]
dependencies = []

[project.optional-dependencies]
fastapi = [
    "fastapi[standard]>=0.110.0",
    "starlette>=0.36.0"
]
redis = [
    "redis>=5.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://phinehas.dev"
Repository = "https://github.com/phinehas-hq/sdks"
Documentation = "https://phinehas.dev/docs"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
